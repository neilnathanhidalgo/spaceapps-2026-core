[project]
name = "spaceapps-core"
version = "0.1.0"
description = "Backend for NASA Space Apps 2026 — Field Shift: adapting farms with NASA data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "spaceapps-2026-core contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "xarray>=2024.10",
    "s3fs>=2024.10",
    "netCDF4>=1.7",
    "zarr>=2.18",
    "earthaccess>=0.12",
    "diskcache>=5.6",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "rich>=13.9",
    "pystac-client>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spaceapps_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit real external APIs (skipped without credentials/network)",
]
addopts = "-ra -q --strict-markers"
